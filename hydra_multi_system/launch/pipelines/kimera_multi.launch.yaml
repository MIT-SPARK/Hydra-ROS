---
launch:
  - arg: {name: sim_time, default: 'true', description: use bag time}
  # robot identifiers
  - arg: {name: robot_name, description: Robot name to use}
  - arg: {name: robot_id, default: '0', description: Robot ID}
  # pipeline
  - arg: {name: optimize, default: 'true', description: run optimization in the backend upon loop closure}
  - arg: {name: exit_after_clock, default: 'false', description: shutdown hydra node after a rosbag finishes playing}
  - arg: {name: labelspace_name, default: ade20k_mit, description: semantic label space}
  - arg: {name: sensor_type, description: 'input sensor type(s) (one of [velodyne16, ouster64, rgbd, hybrid])'}
  - arg: {name: object_variant, description: 'object extraction variant (one of [crisp, khronos, hydra])'}
  - arg: {name: log_path, default: $(env HOME)/.hydra_multi/kimera_multi/$(var robot_name), description: directory to output to}
  # ground segmentation
  - arg: {name: use_ground_seg, default: 'false', description: Use Patchwork ground segmentation to filter ground points}
  - arg: {name: ground_seg_sensor_type, default: velodyne16, description: 'LiDAR type for Patchwork (one of [velodyne16, velodyne64, ouster64, ouster128])'}
  # frames
  - arg: {name: robot_frame, default: $(var robot_name)/base, description: robot body tf frame}
  - arg: {name: odom_frame, default: $(var robot_name)/odom, description: odometry frame}
  - arg: {name: map_frame, default: $(var robot_name)/odom, description: map frame}
  # nodes
  - push_ros_namespace: {namespace: $(var robot_name)}
  - node:
      if: $(var use_ground_seg)
      namespace: patchwork
      pkg: patchwork
      exec: run_patchwork
      name: patchwork
      output: screen
      remap:
        - {from: /patchwork/input_cloud, to: /$(var robot_name)/cloud_registered_lidar}
      param:
        - from: $(find-pkg-share patchwork)/config/$(var ground_seg_sensor_type).yaml
  - group:
      - push_ros_namespace: {namespace: forward}
      - set_remap:
          from: cloud
          to: /$(var robot_name)/$(if use_ground_seg patchwork/cloud_groundseg_lidar cloud_registered_lidar)
      - include:
          if: $(var use_ground_seg)
          file: $(find-pkg-share semantic_inference_ros)/launch/closed_set.launch.yaml
          arg:
            - {name: show_configs, value: 'false'}
            - {name: compressed_rgb, value: 'true'}
            - {name: run_backprojection, value: 'true'}
            - {name: backprojection_config, value: '{projection: {unknown_label: -1, input_label_fieldname: label, allowed_labels: [4], override_labels: []}, camera_frame: $(var robot_name)/forward_color_optical_frame}'}
      - include:
          unless: $(var use_ground_seg)
          file: $(find-pkg-share semantic_inference_ros)/launch/closed_set.launch.yaml
          arg:
            - {name: show_configs, value: 'false'}
            - {name: compressed_rgb, value: 'true'}
            - {name: run_backprojection, value: 'true'}
            - {name: backprojection_config, value: '{projection: {unknown_label: -1}, camera_frame: $(var robot_name)/forward_color_optical_frame}'}
  - node:
      pkg: hydra_ros
      exec: hydra_ros_node
      name: hydra
      on_exit: shutdown
      remap:
        - {from: hydra/input/rgbd/depth_registered/image_rect, to: forward/depth/image_rect_raw}
        - {from: hydra/input/rgbd/rgb/image_raw, to: forward/color/image_raw}
        - {from: hydra/input/rgbd/rgb/camera_info, to: forward/color/camera_info}
        - {from: hydra/input/rgbd/semantic/image_raw, to: forward/semantic/image_raw}
        - {from: hydra/input/ouster64/pointcloud, to: forward/labeled_cloud}
        - {from: hydra/input/velodyne16/pointcloud, to: forward/labeled_cloud}
        - {from: hydra/detect_object, to: detect_object}
      args: >-
        --config-utilities-var robot_name=$(var robot_name)
        --config-utilities-var robot_frame=$(var robot_frame)
        --config-utilities-file $(find-pkg-share hydra)/config/label_spaces/$(var labelspace_name)_label_space.yaml
        --config-utilities-file $(find-pkg-share hydra_multi_system)/config/pipelines/kimera_multi.yaml
        --config-utilities-file $(find-pkg-share hydra_multi_system)/config/pipelines/variants/kimera_multi_$(var object_variant).yaml
        --config-utilities-file $(find-pkg-share hydra_multi_system)/config/pipelines/input/kimera_multi_$(var sensor_type).yaml
        --config-utilities-yaml {robot_id: $(var robot_id), odom_frame: $(var odom_frame), robot_frame: $(var robot_frame), map_frame: $(var map_frame)}
        --config-utilities-yaml {backend: {optimize_on_lc: $(var optimize), publish_backend_tf: false}}
        --config-utilities-yaml {exit_after_clock: $(var exit_after_clock), log_path: $(var log_path)}
        --config-utilities-yaml {glog_verbosity: 0, config_verbosity: 1, show_run_settings: false, preprint_config: false}
  - include:
      file: $(find-pkg-share hydra_multi_system)/launch/visualizer.launch.yaml
      arg:
        - {name: use_mesh_color_adapter, value: 'true'}
        - {name: rviz_path, value: $(find-pkg-share hydra_multi_system)/rviz/kimera_multi.rviz}
  - node:
      pkg: tf2_ros
      exec: static_transform_publisher
      name: map_tf_pub
      args: --frame-id map --child-frame-id $(var robot_name)/odom
      param:
        - {name: use_sim_time, value: $(var sim_time)}
